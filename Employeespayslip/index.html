<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="payslip,employees" />
    <meta name="keywords" content="login,payslip,payroll" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Login - Employee's PaySlip</title>
    <link rel="icon" href="./assets/images/loginLogo. Gif.gif" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            font-family: "Quicksand";

        }

        body {
            background-color: #fdd3b1;
            padding: 4%;
        }

        .loginimg {
            margin-left: 15%;
            margin-top: 10%;
        }

        .loginimg img {
            border-radius: 50%;
            height: 400px;
        }

        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;

            border-radius: 10px;

        }

        .form-control {
            background-color: #fdd3b1;
            border: 1px solid rgb(143, 138, 138);
            border-radius: 10px;
            padding-bottom: 3%;
            padding-left: 12%;
        }

        .toggle-password {
            cursor: pointer;
        }

        .form-error {
            color: red;
            font-size: 0.9em;
        }

        .inputlogin {
            padding-bottom: 4%;
            position: relative;


        }

        .inputlogin img {
            position: absolute;
            top: 7px;
            padding-left: 2%;

        }

        .loginBtn {
            background-color: #f8cc14;
            border-radius: 10px;

        }

        .forgot {
            color: black;
        }

        .loginhead {
            padding-bottom: 10%;
        }

        .logina {
            text-decoration: none;
            color: rgb(59, 57, 57);
            font-weight: bold;
        }

        @media (max-width: 767px) {
            .loginimg {
                margin-left: 2%;
                margin-right: 2%;
                max-width: 100%;
                height: auto;
            }

            .loginimg img {
                width: 250px;
                height: auto;
            }


        }
    </style>
</head>

<body>
    <main>
        <div class="container-fluid logincont">
            <div class="row">
                <div class="col-12 col-sm-12 col-md-6 col-lg-6">
                    <div class="loginimg">
                        <img src="./assets/images/loginLogo. Gif.gif" />
                    </div>
                </div>
                <div class="col-12 col-sm-12 col-md-6 col-lg-6">
                    <div class="login-container">
                        <h4 class="text-center mb-4 loginhead">Login</h4>
                        <form id="loginForm" novalidate>
                            <div class="mb-3 inputlogin">
                                <img src="./assets/images/mail.png">
                                <input type="text" id="name" class="form-control" placeholder="Enter Your Name"
                                    required />
                                <div class="form-error" id="nameError"></div>
                            </div>

                            <div class="mb-3 inputlogin">
                                <img src="./assets/images/Password.png">
                                <input type="password" id="password" class="form-control" placeholder="Password"
                                    required />
                            </div>
                            <div class="form-error" id="passwordError"></div>

                            <div class="mb-3 text-end">
                                <a href="#" class="text-decoration-none forgot">Forgot Password?</a>
                            </div>
                            <div class="logincls">
                                <button type="submit" class="btn w-100 loginBtn"><a href="./pages/overviewfinal.html"
                                        class="logina">Login</a>

                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/login.js"></script>
</body>

</html>
